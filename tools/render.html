  topL.visible = turned > 0; if (turned > 0) { topL.position.set(-PWb/2, hL + 0.01, 0); topMatL.map = tex[2*turned - 1]; topMatL.needsUpdate = true; }

window.eventTimes = () => { prepareBook(); const S = schedule(); return {land: startT.map((s, i) => [s + DROP, group[i], bricks[i].kind, bricks[i].w*bricks[i].d]), capDown: T_CAPDOWN[1], flips: S.map(([s, d]) => [T_BOOK + s, d]), book: T_BOOK}; };
